services:
  night-shelf:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_PATH: /data/bookstores.sqlite
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me-admin-token}
    volumes:
      - night_shelf_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  night_shelf_data:
